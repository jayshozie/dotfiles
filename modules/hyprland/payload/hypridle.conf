general {
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'disable' })"
}

listener {
    timeout = 5
    on-timeout = if pgrep -x 'hyprlock'; then echo "[$(date '+%Y/%m/%d %H:%M:%S')] LOCKED - Turning OFF" >> /tmp/hypridle.log; hyprctl dispatch "hl.dsp.dpms({ action = 'disable' })"; else echo "[$(date '+%Y/%m/%d %H:%M:%S')] UNLOCKED - Ignoring" >> /tmp/hypridle.log; fi
    on-resume = echo "[$(date '+%Y/%m/%d %H:%M:%S')] RESUME - Turning ON" >> /tmp/hypridle.log; hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
}
