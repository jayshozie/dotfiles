# ARCHITECTURAL VARIABLES
$font = JetBrainsMono Nerd Font ExtraBold
$font_color = rgb(120, 127, 153)
$subtext_color = rgba(120, 127, 153, 0.6)

$outer_gradient = rgba(7aa2f7ee) rgba(bb9af7ff) 90deg
$check_gradient = rgba(e0af68ff) rgba(bb9af7ff) 90deg
$fail_gradient = rgba(f7768eff) rgba(bb9af7ff) 90deg

general {
    hide_cursor = false
    no_fade_in = false
    grace = 0
}

animations {
    enabled = true

    bezier = snappy, 0.16, 1, 0.3, 1
    bezier = linear, 0, 0, 1, 1
    animation = inputFieldColors, 1, 0.2, snappy
    animation = inputFieldDots, 1, 0.2, linear
    animation = fade, 1, 0.5, default
}

background {
    monitor = eDP-1
    path = /home/jaysh/pics/wallpapers/safak/safak-tux-wallpaper.png

    # The "Creamy" Blur
    blur_passes = 2
    blur_size = 2
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.5
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor = eDP-1
    text = $TIME
    color = $font_color
    font_size = 120
    font_family = $font

    position = 0, 160
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
}

label {
    monitor = eDP-1
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = $font_color
    font_size = 20
    font_family = JetBrainsMono Nerd Font

    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor = eDP-1
    size = 300, 50
    outline_thickness = 3

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounded = true

    outer_color = $outer_gradient
    check_color = $check_gradient
    fail_color = $fail_gradient

    inner_color = rgba(0, 0, 0, 0.5)

    font_color = $font_color

    fade_on_empty = true
    fade_timeout = 1000

    placeholder_text = <span foreground="##787f99">Password...</span>
    hide_input = false
    rounding = -1

    fail_text = <b>Wrong Password. Remaining Attempts: $ATTEMPTS</b>

    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text =   $LAYOUT
    color = $subtext_color
    font_size = 14
    font_family = JetBrainsMono Nerd Font

    onclick = hyprctl switchxkblayout all next

    position = 0, -120
    halign = center
    valign = center
}

label {
    # monitor = HDMI-A-1
    monitor = eDP-1
    text = cmd[update:100] /home/jaysh/.local/bin/scripts/hyprlock-rickroll-text
    color = $font_color
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    onclick = lsof /home/jaysh/multimedia/rickroll.mp3 || mpv --no-video /home/jaysh/multimedia/rickroll.mp3 & disown

    halign = left
    valign = top
    position = 10, -10
}
