#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 0
    gaps_out = 0
    # gaps_in = 10
    # gaps_out = 20
    border_size = 1

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(515c7eaa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 0
    # rounding = 12
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true

        # creamy blur
        passes = 2
        size = 2
        noise = 0.0117
        contrast = 0.8916
        brightness = 0.5
        vibrancy = 0.1696
        vibrancy_darkness = 0.0

        # size = 1
        # passes = 1

        # vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = no, please :)


    ############################################################################
    #                         C R E A M Y   &   F A S T                        #
    ############################################################################

    # # -- Curves --
    # # "creamy": Starts fast, deceleration heavy.
    # # It hits 90% of the movement instantly, then glides the last 10%.
    # bezier = creamy, 0.05, 0.9, 0.1, 1.0
    # 
    # bezier = linear, 0, 0, 1, 1

    # # -- Animations --
    # # Windows: Speed 3 is fast. Popin 90% means it only has to grow a little
    # # bit, making it feel more stable/mature than a full zoom.
    # animation = windows, 1, 3, creamy, popin 90%
    # animation = windowsOut, 1, 3, creamy, popin 90%
    # animation = windowsMove, 1, 3, creamy

    # # Fade: Very fast.
    # animation = fade, 1, 3, creamy
    # 
    # # Workspaces: 'slide' feels creamier than fade.
    # # Speed 4 gives it just enough time to show the curve.
    # animation = workspaces, 1, 4, creamy, fade

    # # Border: Instant feedback.
    # # animation = border, 1, 1, linear
    # # animation = borderangle, 1, 30, linear, loop


    ############################################################################
    #                         B O U N C Y   B O Y                              #
    ############################################################################

    # # -- Curves --
    # # A custom curve that goes slightly past the limit (1.05) and snaps back.
    # # This creates the "bouncy" or "elastic" feel.
    # bezier = jayshBounce, 0.05, 0.9, 0.1, 1.05
    # 
    # # "smoothOut": A curve for things exiting the screen.
    # bezier = smoothOut, 0.36, 0, 0.66, -0.56
    # 
    # # "linear": Standard constant speed.
    # bezier = linear, 0, 0, 1, 1


    # # -- Animations --
    # 
    # # Windows: Use the bounce when opening, but a smooth exit when closing.
    # # 'popin 80%' makes them grow from the center.
    # animation = windows, 1, 5, jayshBounce, popin 80%
    # animation = windowsOut, 1, 4, smoothOut, popin 80%
    # animation = windowsMove, 1, 4, jayshBounce
    # 
    # # Borders: A flash of color when focused.
    # animation = border, 1, 10, default
    # # Keeps the border gradient rotating
    # animation = borderangle, 1, 8, linear, loop
    # 
    # # Fade: Smooth transitions for opacity
    # animation = fade, 1, 10, default
    # animation = workspaces, 1, 6, jayshBounce, slide


    ############################################################################
    #                           D E F A U L T                                  #
    ############################################################################

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

