################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# monitor=eDP-1,2560x1600@240,0x0,1.6
# monitor=HDMI-A-1,1920x1080@60,auto-right,1

monitorv2 {
    output = eDP-1
    mode = 2560x1600@240
    position = auto
    scale = 1.6
    transform = 0
}
monitorv2 {
    output = HDMI-A-1
    mode = 1920x1080@60
    position = auto-right
    scale = 1
    transform = 0
}


